<!DOCTYPE html>
<html>
    <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

        <title>News Letter Sign-Up</title>

        <style>
            /*Create styling for each object ID*/
            /* Black background color and centre aligmenet for header section*/
            #pageHeader {background-color: black; text-align: center; align-content: center;}
            /*"em font size and white text colour for header 'Kavanagh Electrical' text*/
            #Header {font-size: 2em; color: white;}

            /*Form styling. Taken from https://www.w3schools.com/CSS/css_form.asp*/
            form {
                border-radius: 5px;
                background-color: #f2f2f2;
                padding: 20px;
            }

            label {display: block;}

            input[type=text], select {
                width: 100%;
                padding: 12px;
                margin: 8px 0;
                display: inline-block;
                border: 1px solid #ccc;
                border-radius: 4px;
                box-sizing: border-box;
            }

            input[type=email], select {
                width: 100%;
                padding: 12px;
                margin: 8px 0;
                display: inline-block;
                border: 1px solid #ccc;
                border-radius: 4px;
                box-sizing: border-box;
            }

            input[type=submit] {
                width: 100%;
                background-color: rgb(239, 54, 53);
                color: white;
                padding: 14px;
                margin: 8px 0;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }
            </style>

    </head>
    <body><div class = "container">
        <!--Page Header Div-->
        <div id = "pageHeader">
        <div class="row">
        <div class = "col-md-2"><a href = "login.html" class = "btn btn-secondary btn-sm">Login & Order Summary</a></div>
        <div class = "col-lg-8" id="Header"><b>Kavanagh Electronics</b></div>
        <div class = "col-lg-2" ><a href = "../"  class = "btn btn-secondary btn-sm">Home</a></div>
        </div>
    </div> <br>

            <!--News letter sign-up form. First name, last name, email address and accept T&Cs required before being able to submit form-->
        <form id = "newsLetterForm">
            <p>First Name:<br>
                <input type = "text" placeholder = "First Name" required/>
            </p>
            <p>Last Name:<br>
                <input type = "text" placeholder = "Last Name" required/>
            </p>
            <p>Please enter your email address:<br>
            <input type="email" placeholder = "email@host.com" required></p>
            <p>Accept terms and conditions:<br>
                <input type = "checkbox" required/> I accept
            </p>
            <p>
                <input type = "submit"/></p>
            </p>
        </form>
    </div></body>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>

    <script>
        //JS function to create an alert after submit button is clicked if all form fields are valid. addEventListener taken from https://developer.mozilla.org/en-US/docs/Web/API/HTMLFormElement/submit_event#:~:text=the%20user%20presses%20Enter%20while,validation%20triggers%20an%20invalid%20event.
            const form = document.getElementById('newsLetterForm');
            form.addEventListener('submit', function(event){
                alert ("You have signed up for the newsletter! Thank you!")
            })
        
    </script>

</html>
