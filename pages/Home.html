<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <title>Home Page</title>

    <style>
            /*Create styling for each object ID*/
            /* Black background color and centre aligmenet for header section*/
            #pageHeader {background-color: black; text-align: center; align-content: center;}
            /*2em font size and white text colour for header 'Kavanagh Electrical' text*/
            #Header {font-size: 2em; color: white;}
            /*100% width and red bg colour for carousel div*/
            #carouselStyling {width: 100; background-color: rgb(239, 54, 53);}
            /*Red colour for product page btns*/
            .btn-primary{background-color: rgb(239, 54, 53);}

    </style>

  </head>
  <body>
    <!--BS container div for page header. Bootstrap columns used for layout-->
    <div class = "container" id = "pageHeader">
        <div class="row">
            <!--Login button - routing to login.html-->
            <div class = "col-md-2"><a href = "login.html" class = "btn btn-secondary btn-sm">Login & Order Summary</a></div>
            <div class = "col-lg-8" id="Header"><b>Kavanagh Electronics</b></div>
            <!--Cart button, routing to cart.ejs-->
            <div class = "col-lg-2"><a href = "/cart"  class = "btn btn-secondary btn-sm">Checkout</a></div>
        </div>
    </div> <br>

    <!--Code block taken from https://getbootstrap.com/docs/5.1/components/carousel/-->
    <!--Add Image carousel. Unsure as to working of this code-->
    <div class = "container" id = "carouselStyling">
    <div id="carouselExampleSlidesOnly" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="Images/Home/BestPrices.jpg" class="d-block w-100" alt="Best Prices">
            </div>
            <div class="carousel-item">
                <img src="Images/Home/SaleNowOn.jpg" class="d-block mx-auto" style = "height: 700px " alt ="Sale Now On">
            </div>
        </div>
    </div>
    </div>
    <br><br>

    <!--BS Container div for table header. XL col size used-->
    <div class = "container">
        <div class = "row">
            <div class = "col-md-6">
                <b>Products:</b>
            </div>
            <div class = "col-md-6">
                <b>Or Search P/N:</b>
            </div>
        </div>
    </div>

    <!--BS Table used for list of products. BS buttons used-->
    <div class = "container">
        <div class = "row">
            <div class = "col-md-6">
                <a href ="/shop?rec=101" class = "btn btn-primary btn-md border secondary" >iPhone</a><br>
                <a href ="/shop?rec=102" class = "btn btn-primary btn-md border secondary">Asus Zenbook 14</a><br>
                <a href ="/shop?rec=103" class = "btn btn-primary btn-md border secondary">LG 55 Inch TV</a><br>
                <a href ="/shop?rec=104" class = "btn btn-primary btn-md border secondary">iPad</a><br>
                <a href ="/shop?rec=105" class = "btn btn-primary btn-md border secondary">S25 ultra</a><br>
            </div>
            <div class = "col-md-6">
                <form action="/shop" method="get">
                    <input type = "text" id="rec" name="rec" value="101"><br>
                    <input type = "submit">
                </form>
            </div>
        </div>
    </div>

    <br><br><br>

    <!--Newsletter sign up-->
    <div class = "container">
        <div class = "d-flex justify-content-center">
            <a href = "newsLetter.html">Sign up to our news letter!</a>
        </div>
    </div>

    <!--Bootstrap script-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous">

    </script>
  </body>
</html>
